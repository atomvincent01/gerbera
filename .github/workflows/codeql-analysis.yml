name: "CodeQL PR4024 rebase preflight"

on:
  push:
    branches: [preflight/rebased-4024-codeql-261022]

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        language: [ 'cpp', 'javascript' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - if: matrix.language == 'cpp'
        name: Install Deps
        run: |
           sudo apt-get update && \
           sudo apt-get install -y \
             libpugixml-dev libexiv2-dev libsqlite3-dev \
             libduktape207 duktape-dev \
             lsb-release uuid-dev\
             libmagic-dev libmatroska-dev libexif-dev

           sudo bash ./scripts/install-pupnp.sh
           sudo bash ./scripts/install-fmt.sh
           sudo bash ./scripts/install-spdlog.sh
           sudo bash ./scripts/install-utf8cpp.sh
           sudo bash ./scripts/install-taglib.sh
           sudo bash ./scripts/install-libzip.sh
           sudo bash ./scripts/install-libzippp.sh
           sudo bash ./scripts/install-cxxopts.sh

        # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
